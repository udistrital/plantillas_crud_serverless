  V2CrudEstructuraFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/handlers/v2/crud_estructura/
      Handler: app.lambda_handler
      Runtime: python3.12
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          PLANTILLAS_CRUD_HOST: !Ref CrudHost
          PLANTILLAS_CRUD_PORT: !Ref CrudPort
          PLANTILLAS_CRUD_USERNAME: !Ref CrudUsername
          PLANTILLAS_CRUD_PASS: !Ref CrudPass
          PLANTILLAS_CRUD_DB: !Ref CrudDB
          PLANTILLAS_AUTH_DB: !Ref AuthDB
          TIMEZONE: !Ref Timezone
      Events:
        CreateV2Estructura:
          Type: Api
          Properties:
            Path: /v2/estructura
            Method: post

        GetV2Estructura:
          Type: Api
          Properties:
            Path: /v2/estructura/{id}
            Method: get

        GetAllV2Estructura:
          Type: Api
          Properties:
            Path: /v2/estructura
            Method: get

        PutV2Estructura:
          Type: Api
          Properties:
            Path: /v2/estructura/{id}
            Method: put

        DeleteV2Estructura:
          Type: Api
          Properties:
            Path: /v2/estructura/{id}
            Method: delete

Outputs:
  WebEndpoint:
    Description: "API Gateway endpoint URL for Prod stage"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
