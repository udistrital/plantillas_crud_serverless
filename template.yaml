AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  plantillas_crud

  Sample SAM Template for plantillas_crud

Globals:
  Function:
    Timeout: 60

Parameters:
  CrudUsername:
    Description: Database User Username
    Type: String
    Default: ""
  CrudPass:
    Type: String
    Default: ""
  CrudHost:
    Type: String
    Default: ""
  CrudPort:
    Type: String
    Default: ""
  CrudDB:
    Type: String
    Default: ""
  Timezone:
    Type: String
    Default: "America/Bogota"
  AuthDB:
    Type: String
    Default: "plantillas"


Resources:
  CrudPlantillaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/handlers/crud_plantilla/
      Handler: app.lambda_handler
      Runtime: python3.12
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          PLANTILLAS_CRUD_HOST: !Ref CrudHost
          PLANTILLAS_CRUD_PORT: !Ref CrudPort
          PLANTILLAS_CRUD_USERNAME: !Ref CrudUsername
          PLANTILLAS_CRUD_PASS: !Ref CrudPass
          PLANTILLAS_CRUD_DB: !Ref CrudDB
          PLANTILLAS_AUTH_DB: !Ref AuthDB
          TIMEZONE: !Ref Timezone
      Events:
        CreatePlantilla:
          Type: Api
          Properties:
            Path: /plantilla
            Method: post

        GetPlantilla:
          Type: Api
          Properties:
            Path: /plantilla/{id}
            Method: get

        GetAllPlantilla:
          Type: Api
          Properties:
            Path: /plantilla
            Method: get

        PutPlantilla:
          Type: Api
          Properties:
            Path: /plantilla/{id}
            Method: put

        DeletePlantilla:
          Type: Api
          Properties:
            Path: /plantilla/{id}
            Method: delete

        # Alias /v1 de las rutas anteriores. Las rutas sin prefijo se conservan
        # para no romper los consumidores actuales.
        CreatePlantillaV1:
          Type: Api
          Properties:
            Path: /v1/plantilla
            Method: post

        GetPlantillaV1:
          Type: Api
          Properties:
            Path: /v1/plantilla/{id}
            Method: get

        GetAllPlantillaV1:
          Type: Api
          Properties:
            Path: /v1/plantilla
            Method: get

        PutPlantillaV1:
          Type: Api
          Properties:
            Path: /v1/plantilla/{id}
            Method: put

        DeletePlantillaV1:
          Type: Api
          Properties:
            Path: /v1/plantilla/{id}
            Method: delete

  CrudTipoPlantillaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/handlers/crud_tipo_plantilla/
      Handler: app.lambda_handler
      Runtime: python3.12
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          PLANTILLAS_CRUD_HOST: !Ref CrudHost
          PLANTILLAS_CRUD_PORT: !Ref CrudPort
          PLANTILLAS_CRUD_USERNAME: !Ref CrudUsername
          PLANTILLAS_CRUD_PASS: !Ref CrudPass
          PLANTILLAS_CRUD_DB: !Ref CrudDB
          PLANTILLAS_AUTH_DB: !Ref AuthDB
          TIMEZONE: !Ref Timezone
      Events:
        CreateTipoPlantilla:
          Type: Api
          Properties:
            Path: /tipo_plantilla
            Method: post

        GetTipoPlantilla:
          Type: Api
          Properties:
            Path: /tipo_plantilla/{id}
            Method: get

        GetAllTipoPlantilla:
          Type: Api
          Properties:
            Path: /tipo_plantilla
            Method: get

        PutTipoPlantilla:
          Type: Api
          Properties:
            Path: /tipo_plantilla/{id}
            Method: put

        DeleteTipoPlantilla:
          Type: Api
          Properties:
            Path: /tipo_plantilla/{id}
            Method: delete

        # Alias /v1 de las rutas anteriores. Las rutas sin prefijo se conservan
        # para no romper los consumidores actuales.
        CreateTipoPlantillaV1:
          Type: Api
          Properties:
            Path: /v1/tipo_plantilla
            Method: post

        GetTipoPlantillaV1:
          Type: Api
          Properties:
            Path: /v1/tipo_plantilla/{id}
            Method: get

        GetAllTipoPlantillaV1:
          Type: Api
          Properties:
            Path: /v1/tipo_plantilla
            Method: get

        PutTipoPlantillaV1:
          Type: Api
          Properties:
            Path: /v1/tipo_plantilla/{id}
            Method: put

        DeleteTipoPlantillaV1:
          Type: Api
          Properties:
            Path: /v1/tipo_plantilla/{id}
            Method: delete

  # ---------------------------------------------------------------------------
  # v2 - Versionamiento controlado de plantillas
  # Modelo: plantilla -> plantilla_version -> estructura -> campo
  # ---------------------------------------------------------------------------
  V2CrudPlantillaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/handlers/v2/crud_plantilla/
      Handler: app.lambda_handler
      Runtime: python3.12
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          PLANTILLAS_CRUD_HOST: !Ref CrudHost
          PLANTILLAS_CRUD_PORT: !Ref CrudPort
          PLANTILLAS_CRUD_USERNAME: !Ref CrudUsername
          PLANTILLAS_CRUD_PASS: !Ref CrudPass
          PLANTILLAS_CRUD_DB: !Ref CrudDB
          PLANTILLAS_AUTH_DB: !Ref AuthDB
          TIMEZONE: !Ref Timezone
