          PLANTILLAS_CRUD_HOST: !Ref CrudHost
          PLANTILLAS_CRUD_PORT: !Ref CrudPort
          PLANTILLAS_CRUD_USERNAME: !Ref CrudUsername
          PLANTILLAS_CRUD_PASS: !Ref CrudPass
          PLANTILLAS_CRUD_DB: !Ref CrudDB
          PLANTILLAS_AUTH_DB: !Ref AuthDB
          TIMEZONE: !Ref Timezone
      Events:
        CreateV2PlantillaVersion:
          Type: Api
          Properties:
            Path: /v2/plantilla_version
            Method: post

        GetV2PlantillaVersion:
          Type: Api
          Properties:
            Path: /v2/plantilla_version/{id}
            Method: get

        GetAllV2PlantillaVersion:
          Type: Api
          Properties:
            Path: /v2/plantilla_version
            Method: get

        PutV2PlantillaVersion:
          Type: Api
          Properties:
            Path: /v2/plantilla_version/{id}
            Method: put

        DeleteV2PlantillaVersion:
          Type: Api
