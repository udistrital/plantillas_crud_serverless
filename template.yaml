        CreateV2Plantilla:
          Type: Api
          Properties:
            Path: /v2/plantilla
            Method: post

        GetV2Plantilla:
          Type: Api
          Properties:
            Path: /v2/plantilla/{id}
            Method: get

        GetAllV2Plantilla:
          Type: Api
          Properties:
            Path: /v2/plantilla
            Method: get

        PutV2Plantilla:
          Type: Api
          Properties:
            Path: /v2/plantilla/{id}
            Method: put

        DeleteV2Plantilla:
          Type: Api
          Properties:
            Path: /v2/plantilla/{id}
            Method: delete

  V2CrudCampoFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/handlers/v2/crud_campo/
      Handler: app.lambda_handler
      Runtime: python3.12
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          PLANTILLAS_CRUD_HOST: !Ref CrudHost
          PLANTILLAS_CRUD_PORT: !Ref CrudPort
          PLANTILLAS_CRUD_USERNAME: !Ref CrudUsername
          PLANTILLAS_CRUD_PASS: !Ref CrudPass
          PLANTILLAS_CRUD_DB: !Ref CrudDB
          PLANTILLAS_AUTH_DB: !Ref AuthDB
          TIMEZONE: !Ref Timezone
      Events:
        CreateV2Campo:
          Type: Api
          Properties:
            Path: /v2/campo
            Method: post

        GetV2Campo:
          Type: Api
          Properties:
            Path: /v2/campo/{id}
            Method: get

        GetAllV2Campo:
          Type: Api
          Properties:
            Path: /v2/campo
            Method: get

        PutV2Campo:
          Type: Api
          Properties:
            Path: /v2/campo/{id}
            Method: put

        DeleteV2Campo:
          Type: Api
          Properties:
            Path: /v2/campo/{id}
            Method: delete

  V2CrudPlantillaVersionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/handlers/v2/crud_plantilla_version/
      Handler: app.lambda_handler
      Runtime: python3.12
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - AWSLambdaBasicExecutionRole
      Environment:
